<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="post.css">
    <title>Post a Tutoring Job</title>
</head>
<body>
    <header>
        <h1>Post a Tutoring Job</h1>
    </header>
    <main>
        <form action="post_job.php" method="POST">
            <label for="tutee_name">Tutee's Name:</label>
            <input type="text" id="tutee_name" name="tutee_name" required>
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" required>
            <label for="education_level">Education Level:</label>
            <input type="text" id="education_level" name="education_level" required>
            <label for="schedule">Tutoring Schedule:</label>
            <input type="text" id="schedule" name="schedule" required>
            <label for="payment">Payment:</label>
            <input type="number" id="payment" name="payment" required>
            <button type="submit">Post Job</button>
        </form>
        <a href="dashboard.php">Back to Dashboard</a>
    </main>
</body>
</html>
